<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <title>Онлайн-доска</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js" defer></script>
    <script type="module" src="/js/main.js" defer></script>
  </head>
  <body>
    <!-- Экран входа -->
    <div id="login" class="login">
      <form id="login-form" class="login__card">
        <div class="login__brand">
          <span class="logo">Д</span>
          <div>
            <h1>Онлайн-доска</h1>
            <p>Совместный урок в реальном времени</p>
          </div>
        </div>

        <label class="field">
          <span>Ваше имя</span>
          <input name="name" maxlength="40" autocomplete="name" placeholder="Анна" required />
        </label>

        <label class="field">
          <span>Комната</span>
          <input
            name="room"
            maxlength="64"
            pattern="[A-Za-z0-9_\-]{1,64}"
            title="Латинские буквы, цифры, дефис и подчёркивание"
            placeholder="math-7b"
            required
          />
        </label>

        <label class="field">
          <span>Роль</span>
          <select name="role">
            <option value="student">Ученик</option>
            <option value="teacher">Учитель</option>
          </select>
        </label>

        <label class="field" id="code-field" hidden>
          <span>Код учителя</span>
          <input name="code" autocomplete="off" placeholder="Введите код" />
        </label>

        <button type="submit" id="login-submit" class="btn btn--primary btn--wide">Войти в урок</button>
        <p id="login-error" class="login__error" role="alert"></p>
        <p class="login__hint">
          Поделитесь ссылкой вида <code>/?room=math-7b</code> — ученики откроют её без кода.
        </p>
      </form>
    </div>

    <!-- Рабочее пространство -->
    <div id="app" class="app" hidden>
      <header class="toolbar">
        <div class="toolbar__brand">
          <span class="logo logo--small">Д</span>
          <span class="toolbar__title">Доска</span>
        </div>

        <div class="toolbar__group" id="tools" role="toolbar" aria-label="Инструменты">
          <button class="tool" data-tool="select" title="Выбор и перемещение (V)" aria-label="Выбор">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.6L10 20z" /></svg>
          </button>
          <button class="tool" data-tool="brush" title="Кисть (B)" aria-label="Кисть">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c1-4 3-5 5-5s2 2 4 0 6-8 6-8l-3-3s-5 6-8 9c-1.5 1.5-3 3.5-4 7z" /></svg>
          </button>
          <button class="tool" data-tool="eraser" title="Ластик (E)" aria-label="Ластик">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 6 6-7 7H8z" /><path d="M4 21h16" /></svg>
          </button>
          <button class="tool" data-tool="rect" title="Прямоугольник (R)" aria-label="Прямоугольник">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="1" /></svg>
          </button>
          <button class="tool" data-tool="circle" title="Круг (O)" aria-label="Круг">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /></svg>
          </button>
          <button class="tool" data-tool="line" title="Линия (L)" aria-label="Линия">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5" /></svg>
          </button>
          <button class="tool" data-tool="arrow" title="Стрелка (A)" aria-label="Стрелка">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5" /><path d="M12 5h7v7" /></svg>
          </button>
          <button class="tool" data-tool="text" title="Текст (T)" aria-label="Текст">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v15M9 20h6" /></svg>
          </button>
        </div>

        <div class="toolbar__group" id="colors" aria-label="Цвет"></div>

        <label class="width-control" title="Толщина">
          <input id="width-range" type="range" min="1" max="30" step="1" value="4" />
          <span id="width-value">4 px</span>
        </label>

        <div class="toolbar__spacer"></div>

        <button id="image-btn" class="btn btn--ghost" type="button" title="Вставить изображение">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 16l5-5 4 4 3-3 6 6" /><circle cx="8.5" cy="9.5" r="1.5" /></svg>
          <span>Картинка</span>
        </button>
        <button id="clear-btn" class="btn btn--danger" type="button" hidden>Очистить</button>

        <div class="toolbar__status">
          <span id="status" class="status" data-state="pending">Подключение…</span>
          <span id="room-label" class="room-label"></span>
          <button id="leave-btn" class="btn btn--ghost" type="button">Выйти</button>
        </div>
      </header>

      <main class="workspace">
        <div id="board" class="board"></div>

        <aside class="users-panel">
          <h2 class="users-panel__title">Участники <span id="user-count"></span></h2>
          <ul id="user-list" class="user-list"></ul>
          <p id="users-hint" class="users-panel__hint"></p>
          <div class="users-panel__legend">
            <p><kbd>B</kbd> кисть · <kbd>E</kbd> ластик</p>
            <p><kbd>R</kbd> прямоуг. · <kbd>O</kbd> круг</p>
            <p><kbd>L</kbd> линия · <kbd>A</kbd> стрелка</p>
            <p><kbd>T</kbd> текст · <kbd>V</kbd> выбор</p>
            <p><kbd>Del</kbd> удалить (учитель)</p>
          </div>
        </aside>
      </main>

      <input
        type="file"
        id="file-input"
        accept="image/png,image/jpeg,image/webp,image/gif"
        hidden
      />

      <textarea id="text-editor" class="text-editor" hidden maxlength="2000" spellcheck="false"></textarea>
    </div>

    <div id="toast" class="toast" hidden></div>
  </body>
</html>
