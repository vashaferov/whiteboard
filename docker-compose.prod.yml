services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      S3_BUCKET: ${S3_BUCKET:-whiteboard}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      whiteboard:
        condition: service_healthy
    restart: unless-stopped

  whiteboard:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      FRONTEND_DIR: /app/frontend
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-whiteboard}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-whiteboard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-whiteboard-secret}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}/media}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-false}
      S3_CREATE_BUCKET: "true"
      LOG_JSON: "true"
    volumes:
      - whiteboard-data:/app/data
      - whiteboard-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # SeaweedFS: S3-совместимое хранилище изображений. Наружу не публикуется:
  # файлы отдаёт Caddy по /media/*, запись идёт только от приложения.
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "whiteboard",
              "credentials": [{"accessKey": "${S3_ACCESS_KEY:-whiteboard}", "secretKey": "${S3_SECRET_KEY:-whiteboard-secret}"}],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            },
            {"name": "anonymous", "actions": ["Read"]}
          ]
        }
        EOF
        exec weed server -s3 -dir=/data -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-whiteboard}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-whiteboard-secret}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  whiteboard-data:
  whiteboard-uploads:
  redis-data:
  s3-data:
