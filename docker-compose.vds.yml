# Production stack for a VDS that already runs other containers.
# It deliberately:
#   * uses its own compose project name, network and volumes;
#   * keeps the app on loopback and serves TLS on a dedicated port (8443);
#   * never touches ports 80/443 or the existing reverse proxy;
#   * issues and renews its own certificate through the shared ACME webroot;
#   * keeps images in a local uploads volume instead of running SeaweedFS.
#
# See docs/deploy-vds.md for the full runbook.

name: whiteboard-prod

services:
  # TLS edge on a dedicated port (default 8443). It reuses the certificate of
  # the existing nginx-certbot stack read-only; the board domain therefore stays
  # the main domain and ports 80/443 remain owned by the existing proxy.
  edge:
    image: caddy:2.8-alpine
    ports:
      - "${WB_HTTPS_PORT:-8443}:${WB_HTTPS_PORT:-8443}"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      HTTPS_PORT: ${WB_HTTPS_PORT:-8443}
    volumes:
      - ./deploy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - ${TLS_CERTS_DIR:?Set TLS_CERTS_DIR in .env}:/certs:ro
      - edge-data:/data
      - edge-config:/config
    depends_on:
      whiteboard:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  whiteboard:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/${GHCR_REPO:-whiteboard}:${WB_TAG:-latest}
    build: .
    ports:
      - "${WB_BIND:-127.0.0.1}:${WB_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      FRONTEND_DIR: /app/frontend
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REDIS_URL: redis://redis:6379/0
      # Empty bucket switches the app to the local uploads volume; the app
      # serves the files itself under /uploads, so no /media route is needed.
      S3_BUCKET: ""
      S3_ENDPOINT_URL: ""
      S3_PUBLIC_BASE_URL: ""
      LOG_JSON: "true"
    volumes:
      - whiteboard-data:/app/data
      - whiteboard-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whiteboard-data:
  whiteboard-uploads:
  redis-data:
  edge-data:
  edge-config:
