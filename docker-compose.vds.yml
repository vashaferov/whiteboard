# Production stack for a VDS that already runs other containers behind a shared
# reverse proxy (nginx/Caddy/Traefik). It deliberately:
#   * uses its own compose project name, network and volumes;
#   * binds the app to loopback only and never touches ports 80/443;
#   * keeps images in a local uploads volume instead of running SeaweedFS.
#
# The existing proxy must forward the board domain to 127.0.0.1:${WB_PORT}.
# See docs/deploy-vds.md for the full runbook.

name: whiteboard-prod

services:
  whiteboard:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/${GHCR_REPO:-whiteboard}:${WB_TAG:-latest}
    build: .
    ports:
      - "${WB_BIND:-127.0.0.1}:${WB_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      FRONTEND_DIR: /app/frontend
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      REDIS_URL: redis://redis:6379/0
      # Empty bucket switches the app to the local uploads volume; the app
      # serves the files itself under /uploads, so no /media route is needed.
      S3_BUCKET: ""
      S3_ENDPOINT_URL: ""
      S3_PUBLIC_BASE_URL: ""
      LOG_JSON: "true"
    volumes:
      - whiteboard-data:/app/data
      - whiteboard-uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whiteboard-data:
  whiteboard-uploads:
  redis-data:
